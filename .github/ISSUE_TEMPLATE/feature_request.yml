name: Feature request
description: Suggest a new capability or a change in behavior.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work, ideally with a short code example.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds
      description: What you do today instead, if anything.

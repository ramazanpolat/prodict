name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
    - uses: actions/checkout@v7
    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10.3.2
      with:
        version: "0.13.5"
        python-version: ${{ matrix.python-version }}

    - name: Test with pytest (unit tests and doctests), measuring coverage
      env:
        COVERAGE_FILE: .coverage.${{ matrix.python-version }}
      run: uv run --managed-python coverage run -m pytest

    - name: Upload coverage data
      uses: actions/upload-artifact@v7
      with:
        name: coverage-${{ matrix.python-version }}
        path: .coverage.${{ matrix.python-version }}
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7

    - name: Run the examples
      run: |
        for example in examples/*/main.py; do
          uv run --managed-python python "$example"
        done

  # Some lines run only on some Python versions (3.8 and 3.9, 3.14+), so coverage is
  # measured on every version and combined: together they must cover every line and branch.
  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install uv and Python 3.14
      uses: astral-sh/setup-uv@v10.3.2
      with:
        version: "0.13.5"
        python-version: "3.14"

    - name: Download coverage data
      uses: actions/download-artifact@v8
      with:
        pattern: coverage-*
        merge-multiple: true

    - name: Combine and require 100% line and branch coverage
      run: |
        uv run --managed-python coverage combine
        uv run --managed-python coverage report

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.2
      with:
        version: "0.13.5"

    - name: Install dependencies
      run: |
        uv pip install --system flake8 twine

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Build and verify distribution
      run: |
        uv build
        twine check dist/*

  deploy:
    needs: [test, coverage, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.2
      with:
        version: "0.13.5"

    - name: Install dependencies
      run: |
        uv pip install --system twine

    - name: Build distribution
      run: uv build

    - name: Check package
      run: twine check dist/*

    # Publish only when pyproject.toml carries a version PyPI does not have yet, so a push
    # to master without a version bump publishes nothing and never re-uses an old version.
    - name: Check whether this version is already on PyPI
      id: pypi
      run: |
        version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
        status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/prodict/$version/json")
        case "$status" in
          200) echo "prodict $version is already on PyPI; nothing to publish"
               echo "publish=false" >> "$GITHUB_OUTPUT" ;;
          404) echo "prodict $version is new; publishing"
               echo "publish=true" >> "$GITHUB_OUTPUT" ;;
          *)   echo "Unexpected PyPI response $status for prodict $version"
               exit 1 ;;
        esac

    # --skip-existing only here: TestPyPI may already hold this version from an earlier,
    # interrupted run of the same release.
    - name: Upload to TestPyPI
      if: steps.pypi.outputs.publish == 'true'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TESTPYPI_TOKEN }}
      run: twine upload --skip-existing --repository-url https://test.pypi.org/legacy/ dist/*

    - name: Upload to PyPI
      if: steps.pypi.outputs.publish == 'true'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: twine upload dist/*

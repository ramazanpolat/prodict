[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "prodict"
version = "0.8.23"
description = "A dict with dot-accessible attributes, IDE auto-completion and type conversion driven by annotations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Ramazan Polat", email = "ramazanpolat@gmail.com"}
]
keywords = [
    "prodict",
    "dict",
    "dictionary",
    "attribute-access",
    "dot-notation",
    "type-hints",
    "typehinting",
    "auto-complete",
    "json",
    "dynamic-props"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/ramazanpolat/prodict"
Documentation = "https://github.com/ramazanpolat/prodict/tree/master/docs"
Repository = "https://github.com/ramazanpolat/prodict"
Issues = "https://github.com/ramazanpolat/prodict/issues"
Changelog = "https://github.com/ramazanpolat/prodict/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=7.0.0"
]

[tool.pytest.ini_options]
testpaths = ["test_prodict.py", "docs"]
addopts = ["--doctest-glob=*.md"]

[tool.hatch.build.targets.wheel]
packages = ["prodict"]

[tool.hatch.build.targets.sdist]
include = [
    "/prodict",
    "/test_prodict.py",
    "/docs",
    "/examples",
    "/README.md",
    "/CHANGELOG.md"
]
